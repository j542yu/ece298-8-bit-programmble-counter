# Tiny Tapeout project information
project:
  title:        "ECE298 Task 1: 8-bit programmable counter"
  author:       "Judy Yu"
  discord:      ""
  description:  "8-bit programmable counter with asynch rst, synch load, and tri-state output"
  language:     "Verilog"
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_ece298a_8_bit_counter"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "enable_count"
  ui[1]: "enable_output"
  ui[2]: "load"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: ""
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "Output: counter[0], Input: data_to_load[0]"
  uio[1]: "Output: counter[1], Input: data_to_load[1]"
  uio[2]: "Output: counter[2], Input: data_to_load[2]"
  uio[3]: "Output: counter[3], Input: data_to_load[3]"
  uio[4]: "Output: counter[4], Input: data_to_load[4]"
  uio[5]: "Output: counter[5], Input: data_to_load[5]"
  uio[6]: "Output: counter[6], Input: data_to_load[6]"
  uio[7]: "Output: counter[7], Input: data_to_load[7]"

# Do not change!
yaml_version: 6
